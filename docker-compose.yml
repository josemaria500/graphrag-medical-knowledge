services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: graphrag_api
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
    networks:
      - graphrag_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: graphrag_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx:ro
      - ./nginx/home:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - graphrag_net
    restart: unless-stopped

networks:
  graphrag_net:
    driver: bridge
