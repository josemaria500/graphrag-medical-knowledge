events {
    worker_connections 1024;
}

http {
    upstream fastapi_backend {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # ---------- HOME DEL PORTFOLIO (estática) ----------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ---------- ESTÁTICOS DE LA APP (preservar /api/) ----------
        location /api/static/ {
            proxy_pass http://fastapi_backend/api/static/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # ---------- ENDPOINT DE IMPORTACIÓN BATCH (SSE) ----------
        location /api/import {
            proxy_pass http://fastapi_backend/import;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # ---------- API (FastAPI) - resto de endpoints ----------
        location /api/ {
            proxy_pass http://fastapi_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
