events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fastapi_backend {
        server api:8000;
    }

    upstream streamlit_frontend {
        server web:8501;
    }

    server {
        listen 80;
        server_name _;   # TODO: tu dominio cuando lo compres

        # ---------- HOME DEL PORTFOLIO (estática) ----------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ---------- APP GraphRAG (Streamlit) ----------
        location /graphrag/ {
            proxy_pass http://streamlit_frontend/graphrag/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        # ============================================================
        # 🆕 v2: ENDPOINT DE IMPORTACIÓN BATCH (SSE - Server-Sent Events)
        # ============================================================
        # Este endpoint envía un stream de eventos de progreso durante
        # la importación (puede tardar 1-2 min). Requiere configuración
        # especial para que Nginx NO bufferee la respuesta.
        # ============================================================
        location /api/import {
            proxy_pass http://fastapi_backend/import;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ⚡ CLAVE para SSE: deshabilitar buffering
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Timeout largo: la importación puede tardar 1-2 minutos
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Mantener la conexión abierta para el stream
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # ---------- API (FastAPI) - resto de endpoints ----------
        location /api/ {
            proxy_pass http://fastapi_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}