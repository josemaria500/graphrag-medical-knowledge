events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fastapi_backend {
        server api:8000;
    }

    upstream streamlit_frontend {
        server web:8501;
    }

    # ================= HTTP (80) =================
    server {
        listen 80 default_server;
        server_name _;

        # Renovaciones de Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        # Por dominio -> saltar a HTTPS
        if ($host = josemariagalvez.es) {
            return 301 https://$host$request_uri;
        }

        # Por IP -> servir como hasta ahora
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /graphrag/ {
            proxy_pass http://streamlit_frontend/graphrag/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        location /api/ {
            proxy_pass http://fastapi_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ================= HTTPS (443) =================
    server {
        listen 443 ssl;
        server_name josemariagalvez.es;

        ssl_certificate     /etc/letsencrypt/live/josemariagalvez.es/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/josemariagalvez.es/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /graphrag/ {
            proxy_pass http://streamlit_frontend/graphrag/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        location /api/ {
            proxy_pass http://fastapi_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
